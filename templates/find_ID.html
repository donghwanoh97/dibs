<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <title>dibs!</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
        <link rel="stylesheet" type="text/css" href="../static/css/style.css">
        <!-- Flask 서버 실행(실제 백엔드 연동)시 다음으로 변경 -->

    </head>
    <body>
        <div class="signup-wrap">
            <h1 class="signup-title logo">DIBS!</h1>
            <div class="signup-card">

                <!-- 1. 이메일 -->
                <div class="form-row">
                    <label class="form-label" for="user-name">이메일: </label>
                    <input type="text" id="user-name" class="form-input input-width-btn">
                    <button type="button" class="btn-sub">보내기</button>
                </div>

                <!-- 2. 인증번호 -->
                <div class="form-row">
                    <label class="form-label" for="user-name">인증번호: </label>
                    <input type="text" id="user-name" class="form-input">
                    <button id="verify-btn" type="button" class="btn-sub">인증</button>
                </div>

                <!-- 3. 당신의 ID -->
                <p id="result-id" class="your-id hidden">당신의 ID: asdf</p>
            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

        <script src="../static/js/main.js"></script>
    </body>
