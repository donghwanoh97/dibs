<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <title>dibs!</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
    </head>
    <body>
        <div class="signup-wrap">
            <h1 class="signup-title logo">DIBS!</h1>
            <div class="signup-card">

                <!-- 1. 이메일 -->
                <div class="form-row">
                    <label class="form-label" for="userID">이메일: </label>
                    <input type="text" id="userID" class="form-input">
                </div>

                <!-- 2. PW -->
                <div class="form-row">
                    <label class="form-label" for="userPassword">PW: </label>
                    <input type="password" id="userPassword" class="form-input">
                </div>

                <button type="button" class="btn-submit" onclick="login()">로그인</button>

                <div class="find-info">
                    <a href="{{ url_for('auth.get_signup_page') }}">회원가입</a>
                    <a href="{{ url_for('auth.get_find_id_page') }}">ID 찾기</a>
                    <a href="{{ url_for('auth.get_find_pw_page') }}">PW 찾기</a>
                </div>
            </div>
        </div>
        <!-- 로그인 AJAX 처리 스크립트 -->
        <script>
            function login() {
                const userId = $('#userID').val().trim();
                const userPassword = $('#userPassword').val().trim();

                if (!userId) {
                    alert('이메일을 입력해 주세요.');
                    $('#userID').focus();

                    return;
                }

                if (!userPassword) {
                    alert('비밀번호를 입력해 주세요.');
                    $('#userPassword').focus();

                    return;
                }

                $.ajax({
                    type: 'POST',
                    url: '/auth/api/login',
                    data: {
                        user_id: userId,
                        password: userPassword
                    },
                    success: function (response) {
                        if (response.result === 'success') {
                            alert(response.msg);
                            window.location.href = "/";
                        }

                        else{
                            alert(response.msg);
                        }
                    },
                    error: function () {
                        alert('로그인 요청 중 오류가 발생했습니다.');
                    }
                });
            }
        </script>
    </body>
</html>
