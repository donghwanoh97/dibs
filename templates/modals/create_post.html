<div class="modal-backdrop" id="write-modal-backdrop" onclick="document.getElementById('write-modal-backdrop').remove()">
  <dialog class="custom-modal" id="write-modal" open onclick="event.stopPropagation()">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">모임 생성</h2>
        <button class="modal-close-btn" type="button" onclick="document.getElementById('write-modal-backdrop').remove()">&times;</button>
      </div>
      
      <form hx-post="/posts" hx-target="#card-list" hx-swap="afterbegin" hx-on::after-request="document.getElementById('write-modal-backdrop').remove()">
        <div class="modal-body">
          <select name="category">
          {% for category in categories %}
            <option value={{category}}>{{category}}</option>
          {% endfor %}
          </select>
          <input type="text" name="title" placeholder="제목을 입력하세요" required>
          <input type="date" name="date" required>
          <input type="time" name="time" required>
          <input type="number" name="max_count" placeholder="참여인원을 입력하세요" required>

          <label for="content">내용</label>
          <textarea id="content" name="content" rows="4" placeholder="내용을 입력하세요"></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="document.getElementById('write-modal-backdrop').remove()">취소</button>
          <button type="submit" class="btn btn-primary">등록하기</button>
        </div>
      </form>
    </div>
  </dialog>
</div>
