<div class="modal-backdrop" id="profile-modal-backdrop" onclick="document.getElementById('profile-modal-backdrop').remove()">
  <dialog class="custom-modal" id="profile-modal" open onclick="event.stopPropagation()">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">프로필 정보</h2>
        <button class="modal-close-btn" type="button" onclick="document.getElementById('profile-modal-backdrop').remove()">&times;</button>
      </div>
      
      <form hx-patch="/posts/update-nickname"
            class="modal-body">
        
        <div class="mb-3 row align-items-center">
          <label for="user_nickname" class="col-3 col-form-label"><strong>닉네임</strong></label>
          <div class="col-9">
            <input type="text" class="form-control" id="user_nickname" name="user_nickname" value="{{ user.user_nickname }}" required>
          </div>
        </div>

        <div class="mb-3 row">
          <span class="col-3"><strong>이름</strong></span>
          <div class="col-9 py-1">{{ user.user_name }}</div>
        </div>

        <div class="mb-3 row">
          <span class="col-3"><strong>이메일</strong></span>
          <div class="col-9 py-1">{{ user.user_id }}</div>
        </div>

        <div class="modal-footer d-flex justify-content-between">
          <button type="submit" class="btn btn-dark">변경하기</button>
        </div>
      </form>
    </div>
  </dialog>
</div>

<script>
async function updateNickname(event) {
  event.preventDefault(); // 기본 폼 제출(새로고침) 막기
  
  const form = event.target;
  const formData = new FormData(form);

  try {
    const response = await fetch('/posts/update-nickname', {
      method: 'PATCH',
      body: formData
    });

    if (response.ok) {
      alert('닉네임이 성공적으로 변경되었습니다!');
      
      // 모달 닫기
      const modalBackdrop = document.getElementById('profile-modal-backdrop');
      if (modalBackdrop) {
        modalBackdrop.remove();
      }
      
      // 변경된 닉네임 반영을 위해 페이지 새로고침
      location.reload();
    } else {
      const errorText = await response.text();
      alert('변경 실패: ' + errorText);
    }
  } catch (error) {
    console.error('Error:', error);
    alert('오류가 발생했습니다.');
  }
}
</script>
