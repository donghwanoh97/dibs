<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <title>dibs!</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
        <link rel="stylesheet" type="text/css" href="{{url_for('static', filename='css/style.css')}}">
    </head>
    <body>
        <div class="signup-wrap">
            <h1 class="signup-title logo">DIBS!</h1>
            <div class="signup-card">

                <!-- 1. 이메일 -->
                <div class="form-row">
                    <label class="form-label" for="user-email">이메일: </label>
                    <input type="text" id="user-email" class="form-input input-width-btn" placeholder="등록한 이메일 입력">
                    <button type="button" class="btn-sub" onclick="sendAuthCode()">보내기</button>
                </div>

                <!-- 2. 인증번호 -->
                <div class="form-row">
                    <label class="form-label" for="auth-number">인증번호: </label>
                    <input type="text" id="auth-number" class="form-input input-width-btn" placeholder="인증번호 입력">
                    <button id="verify-btn" type="button" class="btn-sub" onclick="verifyAuthCode()">인증</button>
                </div>

                <button type="button" class="btn-submit" onclick="findPassword()">완료</button>
            </div>
        </div>
        <script>
            // 이메일 인증번호 보내기
            function sendAuthCode() {
                const userEmail = $('#user-email').val().trim();
                if (!userEmail) {
                    alert('이메일을 입력해 주세요');
                    $('#user-email').focus();
                    return;
                }
                alert('인증번호가 발송되었습니다');
            }

            // 인증번호 확인
            function verifyAuthCode() {
                const authNumber = $('#auth-number').val().trim();
                if (!authNumber) {
                    alert('인증번호를 입력해 주세요.');
                    $('#auth-number').focus();
                    return;
                }
                alert('인증이 완료되었습니다.');
            }

            // 비밀번호 찾기 및 임시 비밀번호 발급
            function findPassword() {
                const userEmail = $('#user-email').val().trim();

                if (!userEmail) {
                    alert('이메일을 입력해 주세요.');
                    $('#user-email').focus();
                    return;
                }

                $.ajax({
                    type: 'POST',
                    url: '/auth/api/find-pw',
                    data: {
                        user_id: userEmail
                    },
                    success: function (response) {
                        if (response.result === 'success') {
                            alert(response.msg);
                            window.location.href = '/auth/login';
                        }

                        else {
                            alert(response.msg);
                        }
                    },
                    error: function () {
                        alert('비밀번호 찾기 요청 중 오류가 발생했습니다.');
                    }
                });
            }
        </script>
    </body>
</html>
