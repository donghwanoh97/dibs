<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <title>dibs!</title>
        <link rel="stylesheet" type="text/css" href="../static/css/style.css">
        <!-- Flask 서버 실행(실제 백엔드 연동)시 다음으로 변경 -->
         <!-- <link rel="stylesheet" type="text/css" href="{{url_for('static', filename='css/style.css')}}"> -->
    </head>
    <body>
        <div class="signup-wrap">
            <h1 class="signup-title">Dibs!</h1>
            <div class="signup-card">
                <div class="profile-img-wrap"></div>

                <!-- 1. 이름 -->
                <div class="form-row">
                    <label class="form-label" for="user-name">이름: </label>
                    <input type="text" id="user-name" class="form-input">
                </div>

                <!-- 2. 이메일 -->
                <div class="form-row">
                    <label class="form-label" for="user-name">이메일: </label>
                    <input type="text" id="user-name" class="form-input input-width-btn">
                    <button type="button" class="btn-sub">보내기</button>
                </div>

                <!-- 3. 인증번호 -->
                <div class="form-row">
                    <label class="form-label" for="user-name">인증번호: </label>
                    <input type="text" id="user-name" class="form-input input-width-btn">
                    <button type="button" class="btn-sub">인증</button>
                </div>
                
                <!-- 4. 닉네임 -->
                <div class="form-row">
                    <label class="form-label" for="user-name">닉네임: </label>
                    <input type="text" id="user-name" class="form-input">
                </div>
                
                <!-- 5. ID -->
                <div class="form-row">
                    <label class="form-label" for="user-name">ID: </label>
                    <input type="text" id="user-name" class="form-input">
                </div>

                <!-- 6. PW -->
                <div class="form-row">
                    <label class="form-label" for="user-name">PW: </label>
                    <input type="password" id="user-name" class="form-input">
                </div>

                <!-- 7. PW 확인 -->
                <div class="form-row">
                    <label class="form-label" for="user-name">PW 확인: </label>
                    <input type="password" id="user-name" class="form-input">
                </div>
                <button type="submit" class="btn-submit">회원가입</button>
            </div>
        </div>
    </body>
</html>
