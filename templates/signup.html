<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <title>dibs!</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
        <link rel="stylesheet" type="text/css" href="{{url_for('static', filename='css/style.css')}}">
    </head>
    <body>
        <div class="signup-wrap">
            <a href='/'><h1 class="signup-title logo">DIBS!</h1></a>
            <div class="signup-card">

                <!-- 1. 이름 -->
                <div class="form-row">
                    <label class="form-label" for="userName">이름: </label>
                    <input type="text" id="userName" class="form-input">
                </div>

                <!-- 2. 닉네임 -->
                <div class="form-row">
                    <label class="form-label" for="userNickname">닉네임: </label>
                    <input type="text" id="userNickname" class="form-input">
                </div>

                <!-- 3. ID (이메일) -->
                <div class="form-row">
                    <label class="form-label" for="userId">ID: </label>
                    <input type="text" id="userId" class="form-input" placeholder="이메일을 입력해주세요.">
                </div>

                <!-- 5. PW -->
                <div class="form-row">
                    <label class="form-label" for="userPassword">PW: </label>
                    <input type="password" id="userPassword" class="form-input">
                </div>

                <!-- 6. PW 확인 -->
                <div class="form-row">
                    <label class="form-label" for="userPasswordConfirm">PW 확인: </label>
                    <input type="password" id="userPasswordConfirm" class="form-input">
                </div>
                <button type="button" class="btn-submit" onclick="signUp()">회원가입</button>
            </div>
        </div>
        <!-- 회원가입 AJAX 처리 스크립트 -->
        <script>
            function signUp() {
                const userName = $('#userName').val().trim();
                const userNickname = $('#userNickname').val().trim();
                const userId = $('#userId').val().trim();
                const userPassword = $('#userPassword').val().trim();
                const userPasswordConfirm = $('#userPasswordConfirm').val().trim();

                if (!userName) {
                    alert('이름을 입력해 주세요.');
                    $('#userName').focus();

                    return;
                }

                if (!userNickname) {
                    alert('닉네임을 입력해 주세요.');
                    $('#userNickname').focus();

                    return;
                }

                if (!userId) {
                    alert('이메일을 입력해 주세요.');
                    $('#userId').focus();

                    return;
                }

                if (!userPassword) {
                    alert('비밀번호를 입력해 주세요.');
                    $('#userPassword').focus();

                    return;
                }

                // 비밀번호 유효성 검사 (최소 8자 이상, 영문 + 숫자)
                const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$/;

                if (!passwordRegex.test(userPassword)) {
                    alert('비밀번호는 영문과 숫자를 포함하여 8자리 이상이어야 합니다.');
                    $('#userPassword').focus();

                    return;
                }

                if (userPassword !== userPasswordConfirm) {
                    alert('비밀번호가 일치하지 않습니다.');
                    $('#userPasswordConfirm').focus();

                    return;
                }

                $.ajax({
                    type: 'POST',
                    url: '/auth/api/sign-up',
                    data: {
                        user_name: userName,
                        user_nickname: userNickname,
                        user_id: userId,
                        password: userPassword
                    },
                    success: function (response) {
                        if (response.result === 'success') {
                            alert(response.msg);
                            window.location.href = '/auth/login';
                        }

                        else {
                            alert(response.msg);
                        }
                    },

                    error: function () {
                        alert('회원가입 요청 중 오류가 발생했습니다');
                    }
                });
            }
        </script>
    </body>
</html>
