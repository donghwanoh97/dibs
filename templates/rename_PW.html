<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <title>dibs!</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
        <link rel="stylesheet" type="text/css" href="{{url_for('static', filename='css/style.css')}}">
        <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">

    </head>
    <body>
        <div class="signup-wrap">
            <h1 class="signup-title logo">DIBS!</h1>
            <div class="signup-card">

                <!-- 1. 새 비밀번호 -->
                <div class="form-row">
                    <label class="form-label" for="new-password">새 비밀번호: </label>
                    <input type="password" id="new-password" class="form-input input-width-btn">
                </div>

                <!-- 2. 비밀번호 재입력 -->
                <div class="form-row">
                    <label class="form-label" for="confirm-password">비밀번호 재입력: </label>
                    <input type="password" id="confirm-password" class="form-input">
                </div>

                <button type="button" class="btn-submit" onclick="changePassword()">완료</button>
            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script>
            function changePassword() {
                const newPassword = $('#new-password').val().trim();
                const confirmPassword = $('#confirm-password').val().trim();

                if (!newPassword) {
                    alert('새 비밀번호를 입력해 주세요.');
                    $('#new-password').focus();
                    return;
                }

                const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$/;
                if (!passwordRegex.test(newPassword)) {
                    alert('비밀번호는 영문과 숫자를 포함하여 8자리 이상이어야 합니다.');
                    $('#new-password').focus();
                    return;
                }

                if (newPassword !== confirmPassword) {
                    alert('비밀번호가 일치하지 않습니다.');
                    $('#confirm-password').focus();
                    return;
                }

                $.ajax({
                    type: 'POST',
                    url: '/auth/api/rename-pw',
                    data: { new_password: newPassword },
                    success: function (response) {
                        if (response.result === 'success') {
                            alert(response.msg);
                            window.location.href = '/auth/login';
                        } else {
                            alert(response.msg);
                        }
                    },
                    error: function () {
                        alert('비밀번호 변경 중 오류가 발생했습니다.');
                    }
                });
            }
        </script>
    </body>
</html>
