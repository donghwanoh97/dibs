<html lang="ko">
    <head>
        <meta charset="UTF-8">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

        <title>dibs!</title>
        <link rel="stylesheet" type="text/css" href="../static/css/style.css">

    <body>
        <div class="signup-wrap">
            <h1 class="signup-title">Dibs!</h1>
            <div class="signup-card">

                <!-- 1. 새 비밀번호 -->
                <div class="form-row">
                    <label class="form-label" for="user-name">새 비밀번호: </label>
                    <input type="password" id="user-name" class="form-input input-width-btn">
                </div>

                <!-- 2. 비밀번호 재입력 -->
                <div class="form-row">
                    <label class="form-label" for="user-name">비밀번호 재입력: </label>
                    <input type="password" id="user-name" class="form-input">
                </div>

                <button type="submit" class="btn-submit">완료</button>
            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
