<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <title>dibs!</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
        <link rel="stylesheet" type="text/css" href="{{url_for('static', filename='css/style.css')}}">
    </head>
    <body>
        <div class="signup-wrap">
            <h1 class="signup-title logo">DIBS!</h1>
            <div class="signup-card">

                <!-- 1. 새 비밀번호 -->
                <div class="form-row">
                    <label class="form-label" for="new-password">새 비밀번호: </label>
                    <input type="password" id="new-password" class="form-input input-width-btn">
                </div>

                <!-- 2. 비밀번호 재입력 -->
                <div class="form-row">
                    <label class="form-label" for="confirm-password">비밀번호 재입력: </label>
                    <input type="password" id="confirm-password" class="form-input">
                </div>

                <button type="button" class="btn-submit" onclick="changePassword()">완료</button>
            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    </body>
</html>
